services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hellocouncil
    ports:
      - "5432:5432"
    volumes:
      - hellocouncil-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hellocouncil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hellocouncil-postgres:
