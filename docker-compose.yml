services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hellocouncil
    ports:
      - "5432:5432"
    volumes:
      - hellocouncil-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hellocouncil"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.26.2
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.34.0
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

  temporal-namespace-init:
    image: temporalio/admin-tools:1.26.2
    depends_on:
      - temporal
    restart: "no"
    entrypoint:
      [
        "sh",
        "-c",
        "for i in $$(seq 1 30); do out=$$(temporal operator namespace create --address temporal:7233 hellocouncil 2>&1); rc=$$?; echo \"$$out\"; [ $$rc -eq 0 ] && exit 0; case \"$$out\" in *'already exists'*) exit 0;; esac; sleep 2; done; echo 'namespace init failed'; exit 1",
      ]

volumes:
  hellocouncil-postgres:
